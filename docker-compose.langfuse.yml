# Langfuse self-hosted LLM observability stack
# Use with:
#   docker compose -f docker-compose.yml -f docker-compose.langfuse.yml up -d
#
# After first start:
#   1. Open http://localhost:3000 and create an account
#   2. Go to Settings → API Keys → Create new key pair
#   3. Copy LANGFUSE_SECRET_KEY and LANGFUSE_PUBLIC_KEY into your .env file
#   4. Restart: docker compose -f docker-compose.yml -f docker-compose.langfuse.yml up -d backend worker

services:
  langfuse-db:
    image: postgres:15-alpine
    container_name: rag-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse_dev_password}
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"   # exposed on 5433 to avoid conflict with app DB on 5432

  langfuse-server:
    image: ghcr.io/langfuse/langfuse:latest
    container_name: rag-langfuse-server
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - rag-network
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-langfuse_dev_password}@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-change-me-in-prod-use-openssl-rand-hex-32}
      SALT: ${LANGFUSE_SALT:-change-me-in-prod-use-openssl-rand-hex-32}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-Enterprise RAG}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-rag-assistant}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@example.com}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-changeme123}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Admin}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  langfuse_postgres_data:
