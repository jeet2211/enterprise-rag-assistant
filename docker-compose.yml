services:
  redis:
    image: redis:7.4-alpine
    container_name: rag-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    security_opt:
      - no-new-privileges:true
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: enterprise-rag-backend:latest
    container_name: rag-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_add:
      - CHOWN
    env_file:
      - .env
    environment:
      UPLOAD_DIR: /app/backend/uploads
      CHROMA_PERSIST_DIR: /app/backend/chroma_db
      # Stays as SQLite for local dev. Prod compose overrides this with Postgres.
      DATABASE_URL: sqlite:////app/backend/data/app.db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ANONYMIZED_TELEMETRY: "False"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/backend/uploads
      - backend_chroma:/app/backend/chroma_db
      - backend_sqlite:/app/backend/data
    networks:
      - rag-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: enterprise-rag-backend:latest
    container_name: rag-worker
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.tasks.celery_app.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
      - --prefetch-multiplier=1
    security_opt:
      - no-new-privileges:true
    cap_add:
      - CHOWN
    env_file:
      - .env
    environment:
      UPLOAD_DIR: /app/backend/uploads
      CHROMA_PERSIST_DIR: /app/backend/chroma_db
      # Stays as SQLite for local dev. Prod compose overrides this with Postgres.
      DATABASE_URL: sqlite:////app/backend/data/app.db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ANONYMIZED_TELEMETRY: "False"
      LOG_LEVEL: INFO
    volumes:
      - backend_uploads:/app/backend/uploads
      - backend_chroma:/app/backend/chroma_db
      - backend_sqlite:/app/backend/data
    networks:
      - rag-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: enterprise-rag-frontend:latest
    container_name: rag-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rag-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  rag-network:
    driver: bridge

volumes:
  backend_uploads:
  backend_chroma:
  backend_sqlite:
  redis_data:
  postgres_data:
