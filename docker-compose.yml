services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      UPLOAD_DIR: /app/backend/uploads
      CHROMA_PERSIST_DIR: /app/backend/chroma_db
      DB_URL: sqlite:////app/backend/data/app.db
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/backend/uploads
      - backend_chroma:/app/backend/chroma_db
      - backend_sqlite:/app/backend/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  backend_uploads:
  backend_chroma:
  backend_sqlite:
