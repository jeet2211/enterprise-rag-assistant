name: Deploy to Production

on:
  push:
    branches: [main, master]

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/enterprise-rag-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/enterprise-rag-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/enterprise-rag-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/enterprise-rag-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sync compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: /opt/rag-assistant/

      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/rag-assistant

            echo "==> Ensuring shared deploy network exists..."
            docker network inspect deploy_internal >/dev/null 2>&1 || docker network create deploy_internal

            echo "==> Pulling latest images..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            echo "==> Running database migrations..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              run --rm backend \
              alembic upgrade head

            echo "==> Starting services..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d --remove-orphans

            echo "==> Waiting for backend health..."
            for i in $(seq 1 12); do
              if curl -sf https://${{ secrets.DOMAIN }}/api/v1/health > /dev/null; then
                echo "Backend healthy!"
                break
              fi
              echo "Waiting... ($i/12)"
              sleep 5
            done

            echo "==> Smoke tests..."
            curl -f https://${{ secrets.DOMAIN }}/api/v1/health
            curl -f https://${{ secrets.DOMAIN }}/ > /dev/null

            echo "==> Deployment complete! SHA: ${{ github.sha }}"

            # Keep previous image tags for rollback (don't prune latest 2)
            docker image prune -f --filter "until=48h" || true
